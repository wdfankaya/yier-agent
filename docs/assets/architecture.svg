<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="340" viewBox="0 0 1040 340" role="img" aria-labelledby="title desc">
  <title id="title">一二智能客服架构概览</title>
  <desc id="desc">用户通过 FastAPI 和 SSE 与 Agent 交互。Agent 调用业务工具和知识检索，并由会话存储和缓存支持。CLI 可以直接调用 Agent。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1040" height="340" rx="20" fill="#f8fafc"/>
  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
    <g font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">
      <text x="32" y="35">01 / 用户入口</text>
      <text x="248" y="35">02 / 在线服务</text>
      <text x="480" y="35">03 / 对话编排</text>
      <text x="740" y="35">04 / 业务能力</text>
    </g>
    <g fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M208 127 H239"/>
      <path d="M440 127 H471"/>
      <path d="M704 127 H731"/>
      <path d="M584 196 V231" stroke-dasharray="4 4"/>
    </g>
    <rect x="32" y="58" width="176" height="138" rx="12" fill="#fff" stroke="#e2e8f0"/>
    <text x="52" y="99" font-size="21" font-weight="600" fill="#0f172a">用户端</text>
    <text x="52" y="131" font-size="15" fill="#64748b">网页 / API</text>
    <text x="52" y="165" font-size="13" fill="#64748b">发起对话 · 接收事件</text>
    <rect x="248" y="58" width="192" height="138" rx="12" fill="#fff" stroke="#e2e8f0"/>
    <text x="268" y="99" font-size="21" font-weight="600" fill="#0f172a">FastAPI</text>
    <text x="268" y="131" font-size="15" fill="#64748b">SSE 异步事件流</text>
    <text x="268" y="165" font-size="13" fill="#64748b">会话管理 · 限流保护</text>
    <rect x="480" y="58" width="224" height="138" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="500" y="99" font-size="21" font-weight="600" fill="#1d4ed8">一二 Agent</text>
    <text x="500" y="131" font-size="15" fill="#1e40af">ReAct · 模型调用</text>
    <text x="500" y="165" font-size="13" fill="#3b6aa0">意图路由 · 上下文与记忆</text>
    <rect x="740" y="58" width="268" height="138" rx="12" fill="#fff" stroke="#e2e8f0"/>
    <text x="760" y="88" font-size="17" font-weight="600" fill="#0f172a">工具调用</text>
    <text x="760" y="111" font-size="13" fill="#64748b">订单 / 物流 / 退款 · MCP · Skills</text>
    <path d="M760 127 H988" stroke="#e2e8f0"/>
    <text x="760" y="152" font-size="17" font-weight="600" fill="#0f172a">RAG 知识检索</text>
    <text x="760" y="177" font-size="13" fill="#64748b">向量与全文召回 · 可选重排</text>
    <rect x="248" y="240" width="760" height="58" rx="12" fill="#f0fdfa" stroke="#c5e7e0"/>
    <text x="268" y="275" font-size="16" font-weight="600" fill="#115e59">状态存储</text>
    <path d="M358 255 V283" stroke="#c5e7e0"/>
    <text x="378" y="275" font-size="14" fill="#35645f">PostgreSQL 持久化</text>
    <text x="572" y="275" font-size="14" fill="#35645f">Redis 冷读缓存</text>
    <text x="750" y="275" font-size="14" fill="#35645f">pgvector 向量索引</text>
    <text x="32" y="325" font-size="12" fill="#64748b">CLI 可直接调用 Agent；存储与检索组件按配置启用。</text>
  </g>
</svg>
